name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "ci" is the required status check on main (see mgpl-diagnostics/.github scripts/protect-repos.mjs).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRE_PGBOUNCER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install PostgreSQL and PgBouncer (servers started by the tests, not as services)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql pgbouncer
          sudo systemctl stop pgbouncer postgresql || true
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - name: Tests (configuration, userlists, compose, probe, CLI; real PostgreSQL + PgBouncer)
        run: npm test
      - run: npm run build
      - name: The package has no runtime dependencies and the CLI runs
        run: |
          node -e "const p=require('./package.json'); if (p.dependencies && Object.keys(p.dependencies).length) process.exit(1)"
          node dist/cli.js compose > /dev/null
      - name: llms-full.txt is up to date (run `npm run llms` and commit if this fails)
        run: npm run llms && git diff --exit-code -- llms-full.txt
